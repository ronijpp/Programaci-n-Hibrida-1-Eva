<ion-card>
  <ion-card-header>
    <ion-card-title>Figuras Geometricas</ion-card-title>
    <ion-card-subtitle>Triángulo</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>

    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="8" offset-md="2">

    <!-- Imagen del triangulo  -->

    <div class="figure-container">
      <div class="black-border-box">
        <div class="figura-content">
          <img src="assets/triangulo.png.jpeg" alt="Triángulo" class="figure-image">        
        </div>
      </div>
    </div>


    <form [formGroup]="trianguloForm">
      <ion-item>
        <ion-label position="floating">Lado A (cm):</ion-label>
        <ion-input 
          
          type="text" 
          inputmode="decimal"
          formControlName="ladoA" 
          placeholder="Ingrese ladoA" 
          clearInput
          >
        </ion-input>
      </ion-item>

      
      <ion-item>
        <ion-label position="floating">Lado B (cm):</ion-label>
        <ion-input 
          
          type="text" 
          inputmode="decimal"
          formControlName="ladoB" 
          placeholder="Ingrese ladoB" 
          clearInput
          >
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Lado C (cm):</ion-label>
        <ion-input 
          
          type="text" 
          inputmode="decimal"
          formControlName="ladoC" 
          placeholder="Ingrese ladoC" 
          clearInput
          >
        </ion-input>
      </ion-item>

         <!--BOTON CALCULAR PERIMETRO-->
      <ion-button
        expand="block"
        type="button"
        (click)="calcularPerimetro()"
        [disabled]="trianguloForm.invalid"
        color="primary"
        class="calculate-button"
        >
        <span class="button-text">CALCULAR EL PERIMETRO</span>
      </ion-button>
    </form>

    <div *ngIf="mensajeError" class="error-container">
      {{ mensajeError }}
    </div>


<!--Resultado del perimetro-->
    <div *ngIf="perimetro !== null" class="result-container">
      <div class="result-box">

        <span class="result-label">El perímetro es: {{ perimetro | number:'1.2-2' }} cm</span>
      </div>
    </div>

    <div *ngIf="perimetro === null && trianguloForm.dirty && trianguloForm.invalid" class="error-message">

    </div>
     
  </ion-col>
</ion-row>
</ion-grid>


  </ion-card-content>

</ion-card>
